AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Neuralsec read-only AWS Organizations role for the management or delegated
  administrator account. Creates the role neuralsec-cloud-scanner-org-reader,
  trusted only by the Neuralsec broker with the ExternalId of the connection,
  with organizations read actions only.

Parameters:
  ExternalId:
    Type: String
    AllowedPattern: ^neuralsec-[0-9a-f]{32}$
    ConstraintDescription: neuralsec- followed by 32 lowercase hex characters.
    Description: ExternalId of the Neuralsec connection, generated once per connection.
  NeuralsecBrokerArn:
    Type: String
    AllowedPattern: ^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$
    ConstraintDescription: An IAM role ARN.
    Description: ARN of the Neuralsec broker role, the only principal allowed to assume this role.

Resources:
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: neuralsec-cloud-scanner-org-reader
      Description: Neuralsec read-only AWS Organizations role for the management or delegated administrator account.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NeuralsecBrokerAssumeRoleWithExternalId
            Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              AWS: !Ref NeuralsecBrokerArn
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  # cfngen:begin org_reader
  # Generated by tools/cfngen from terraform/modules/policy/actions.json. Do not edit.
  ReadPolicy01:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: neuralsec-cloud-scanner-org-reader-read-01
      Description: Neuralsec organizations read actions, part 1 of 1.
      Roles:
        - !Ref ScannerRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Resource: "*"
            Action:
              - organizations:DescribeAccount
              - organizations:DescribeOrganization
              - organizations:DescribeOrganizationalUnit
              - organizations:DescribePolicy
              - organizations:ListAccounts
              - organizations:ListAccountsForParent
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListParents
              - organizations:ListPolicies
              - organizations:ListRoots
              - organizations:ListTagsForResource
              - organizations:ListTargetsForPolicy

  # cfngen:end org_reader

Outputs:
  RoleArn:
    Description: ARN of the read-only Organizations role in the management or delegated administrator account.
    Value: !GetAtt ScannerRole.Arn
  RoleName:
    Description: Fixed role name the scanner assumes for organization discovery.
    Value: !Ref ScannerRole
