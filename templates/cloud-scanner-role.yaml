            Resource:
              - !Sub "arn:${AWS::Partition}:apigateway:*::/apikeys"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/apikeys/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/apis/*/exports/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/restapis/*/stages/*/exports/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/restapis/*/stages/*/sdks/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys/*"

  # cfngen:end account

Outputs:
  RoleArn:
    Description: ARN of the read-only scanner role in this account.
    Value: !GetAtt ScannerRole.Arn
  RoleName:
    Description: Fixed role name the scanner assumes in this account.
    Value: !Ref ScannerRole
