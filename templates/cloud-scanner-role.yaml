AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Neuralsec read-only cloud inventory role. Creates the role
  neuralsec-cloud-scanner, trusted only by the Neuralsec broker with the
  ExternalId of the connection. EKS access entries are not created by this
  template: CloudFormation cannot expand a cluster name list into one
  AWS::EKS::AccessEntry per cluster, so EKS clusters use the Terraform module
  modules/cloud-scanner-role instead (it also ships the read-only RBAC
  ClusterRole manifest the scanner needs inside each cluster).

Parameters:
  ExternalId:
    Type: String
    AllowedPattern: ^neuralsec-[0-9a-f]{32}$
    ConstraintDescription: neuralsec- followed by 32 lowercase hex characters.
    Description: ExternalId of the Neuralsec connection, generated once per connection.
  NeuralsecBrokerArn:
    Type: String
    AllowedPattern: ^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$
    ConstraintDescription: An IAM role ARN.
    Description: ARN of the Neuralsec broker role, the only principal allowed to assume this role.

Resources:
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: neuralsec-cloud-scanner
      Description: Neuralsec read-only cloud inventory role. Assumed through the Neuralsec broker with the connection ExternalId.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NeuralsecBrokerAssumeRoleWithExternalId
            Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              AWS: !Ref NeuralsecBrokerArn
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  # cfngen:begin account
  # Generated by tools/cfngen from terraform/modules/policy/actions.json. Do not edit.
